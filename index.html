<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Libro de Vuelo</title>
<meta name="description" content="Libro de vuelo personal — formato ANAC 290/2012, progreso hacia CPL y control de costos." />
<meta name="theme-color" content="#111317" />
<!-- Fija el tema ANTES de pintar (evita parpadeo y deja un único set de tokens
     en el CSS: el bloque [data-theme] correspondiente, sin @media duplicado). -->
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div id="app">

  <div id="offline-banner" class="offline-banner" style="display:none">
    <span id="offline-banner-icon"></span> Sin conexión — los vuelos que cargues se guardan localmente y se sincronizan solos al volver la señal.
  </div>

  <!-- ---------- LOGIN ---------- -->
  <div id="vista-login" class="login-wrap" style="display:none">
    <div class="card login-card">
      <h2><span id="login-icon"></span> Libro de Vuelo</h2>

      <div class="toggle-group" style="margin-bottom:14px">
        <button type="button" id="tab-login" class="active">Iniciar sesión</button>
        <button type="button" id="tab-signup">Crear cuenta</button>
      </div>

      <!-- Iniciar sesión -->
      <div id="panel-login">
        <div class="field">
          <label>Email</label>
          <input id="login-email" type="email" placeholder="vos@ejemplo.com" autocomplete="username" />
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn" id="btn-login" style="width:100%">Entrar</button>
        <p style="margin-top:10px"><a href="#" id="link-olvide" class="muted">¿Olvidaste tu contraseña?</a></p>
      </div>

      <!-- Crear cuenta -->
      <div id="panel-signup" style="display:none">
        <div class="field">
          <label>Email</label>
          <input id="signup-email" type="email" placeholder="vos@ejemplo.com" autocomplete="username" />
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input id="signup-password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>Repetir contraseña</label>
          <input id="signup-password2" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button class="btn" id="btn-signup" style="width:100%">Crear cuenta</button>
      </div>

      <!-- Recuperar contraseña -->
      <div id="panel-olvide" style="display:none">
        <p class="muted">Te mandamos un link para elegir una contraseña nueva.</p>
        <div class="field">
          <label>Email</label>
          <input id="olvide-email" type="email" placeholder="vos@ejemplo.com" autocomplete="username" />
        </div>
        <button class="btn" id="btn-olvide" style="width:100%">Mandarme el link</button>
        <p style="margin-top:10px"><a href="#" id="link-volver-login" class="muted">← Volver</a></p>
      </div>

      <!-- Elegir nueva contraseña (llegás acá desde el link del mail) -->
      <div id="panel-nueva-clave" style="display:none">
        <p class="muted">Elegí tu nueva contraseña.</p>
        <div class="field">
          <label>Contraseña nueva</label>
          <input id="nueva-clave" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
        </div>
        <button class="btn" id="btn-nueva-clave" style="width:100%">Guardar contraseña</button>
      </div>

      <p id="login-msg" class="muted" style="margin-top:10px"></p>
    </div>
  </div>

  <!-- ---------- APP ---------- -->
  <div id="vista-app" style="display:none">
    <header class="topbar">
      <div class="brand"><span class="icon" id="brand-icon"></span> Libro de Vuelo</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-perfil" title="Perfil" aria-label="Perfil"></button>
      </div>
    </header>

    <main id="main-content"></main>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
</div>

<!-- Supabase JS (CDN) — bloqueante a propósito: todo lo demás depende de que
     window.supabase exista antes de que corra supabaseClient.js. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- SheetJS y ExcelJS son pesadas (~270KB c/u) y solo las usa UN botón cada
     una, en Exportar — con `defer` no bloquean el arranque del resto de la
     app esperando el CDN (antes, si la red iba lenta, el login/dashboard/etc.
     quedaban colgados hasta que estas dos terminaran de bajar, aunque el
     usuario nunca fuera a exportar nada). Siguen listas antes de que el
     usuario llegue a tocar el botón de exportar. -->
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/aerodromos.js"></script>
<script src="js/coordenadas.js"></script>
<script src="js/autocomplete.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/calc.js"></script>
<script src="js/dolar.js"></script>
<script src="js/exportadorAnac.js"></script>
<script src="js/cache.js"></script>
<script src="js/offline.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/notificaciones.js"></script>
<script src="js/recordatorios.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/nuevoVuelo.js"></script>
<script src="js/views/bitacora.js"></script>
<script src="js/views/aeronaves.js"></script>
<script src="js/views/totales.js"></script>
<script src="js/views/costos.js"></script>
<script src="js/views/perfil.js"></script>
<script src="js/views/exportar.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
