<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Libro de Vuelo</title>
<meta name="description" content="Libro de vuelo personal — formato ANAC 290/2012, progreso hacia CPL y control de costos." />
<meta name="theme-color" content="#2454ff" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">

  <div id="offline-banner" class="offline-banner" style="display:none">
    📴 Sin conexión — los vuelos que cargues se guardan localmente y se sincronizan solos al volver la señal.
  </div>

  <!-- ---------- LOGIN ---------- -->
  <div id="vista-login" class="login-wrap" style="display:none">
    <div class="card login-card">
      <h2>✈️ Libro de Vuelo</h2>
      <p class="muted">Ingresá tu email y te mandamos un link de acceso (sin contraseña).</p>
      <div class="field">
        <label>Email</label>
        <input id="login-email" type="email" placeholder="vos@ejemplo.com" />
      </div>
      <button class="btn" id="btn-enviar-link" style="width:100%">Enviarme el link</button>
      <p id="login-msg" class="muted" style="margin-top:10px"></p>
    </div>
  </div>

  <!-- ---------- APP ---------- -->
  <div id="vista-app" style="display:none">
    <header class="topbar">
      <div class="brand"><span class="icon">✈️</span> Libro de Vuelo</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-theme" title="Cambiar tema">🌙</button>
        <button class="icon-btn" id="btn-logout" title="Cerrar sesión">⎋</button>
      </div>
    </header>

    <nav class="tabs" id="tabs-desktop"></nav>

    <main id="main-content"></main>

    <nav class="bottom-nav" id="tabs-mobile"></nav>
  </div>
</div>

<!-- Supabase JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- SheetJS, para exportar Excel real (.xlsx) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/calc.js"></script>
<script src="js/offline.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/nuevoVuelo.js"></script>
<script src="js/views/bitacora.js"></script>
<script src="js/views/aeronaves.js"></script>
<script src="js/views/totales.js"></script>
<script src="js/views/costos.js"></script>
<script src="js/views/perfil.js"></script>
<script src="js/views/exportar.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
